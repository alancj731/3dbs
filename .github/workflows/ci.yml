name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  api:
    name: API build + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build 3dbs.slnx -c Release
      - run: dotnet test 3dbs.slnx -c Release --no-build --logger "console;verbosity=normal"

  web:
    name: Angular build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  integration:
    name: Every exercise on all 3 databases
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Start SQL Server, MySQL and PostgreSQL
        run: ./setup.sh
      - name: Start the API (seeds MySQL and Postgres)
        env:
          # The verification sends several hundred requests from one address.
          RateLimit__SqlPerMinute: "100000"
          Warmup__Enabled: "false"
        run: |
          dotnet run --project api > api.log 2>&1 &
          for i in $(seq 1 120); do
            curl -sf http://localhost:5080/api/exercises > /dev/null && exit 0
            sleep 2
          done
          cat api.log
          exit 1
      - name: Verify every exercise
        run: python3 tests/verify_exercises.py
      - name: API log
        if: always()
        run: cat api.log
